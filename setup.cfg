;;
;; Boussole package
;;
[metadata]
name = boussole
version = 2.2.0-pre.3
description = Commandline interface to build Sass projects using libsass-python
long_description = file:README.rst
long_description_content_type = text/x-rst
author = David Thenon
author_email = sveetch@gmail.com
url = https://github.com/sveetch/boussole
project_urls =
    Source Code = https://github.com/sveetch/boussole
    Issue Tracker = https://github.com/sveetch/boussole/issues
    Changelog = https://boussole.readthedocs.io/en/latest/changelog.html
    Documentation = https://boussole.readthedocs.io/
license = MIT
keywords = Scss, Sass, Libsass, watchdog
classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Environment :: Console
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Internet
    Topic :: Software Development :: Compilers
    Topic :: Software Development :: Libraries :: Python Modules

[options]
python_requires = >=3.8
include_package_data = True
install_requires =
    click>=5.1,<9.0
    watchdog>=0.8.3
    libsass>=0.19.4
    pyaml>=23.0.0
    colorlog>=6.7.0
packages = find:
zip_safe = True

[options.extras_require]
dev =
    pytest>=7.4.2
quality =
    flake8>=6.1.0
    tox>=4.11.3
    twine>=4.0.2
doc =
    livereload>=2.6.3
    sphinx>=4.3.0
    sphinx-rtd-theme==1.1.0

[options.packages.find]
where = .
exclude=
    docs
    tests

[options.entry_points]
console_scripts =
    boussole = boussole.cli.console_script:cli_frontend

;;
;; Third-party packages configuration
;;
[flake8]
max-line-length = 90
exclude =
    .git,
    .venv,
    build,
    venv,
    __pycache__

[tool:pytest]
addopts = -vv
python_files =
    *.py
testpaths =
    tests

[tox:tox]
minversion = 4.0.0
envlist =
    {py38}-{libsass0194,libsass0200},
    {py311}-{libsass0200,libsass0220},
    {py313}-{libsass0220,libsasslast},

[testenv]
deps =
    libsass0194: libsass>=0.19.4,<0.20.0
    libsass0200: libsass>=0.20.0,<0.21.0
    libsass0220: libsass>=0.22.0,<0.23.0
    libsasslast: libsass>=0.23.0

commands =
    pip install -e .[dev]
    pytest -vv tests
